<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Instrument Sans',system-ui,sans-serif">
  <rect width="1200" height="760" fill="#121210"/>
  <text x="56" y="58" fill="#85847A" font-size="17" letter-spacing="2.4" font-family="'Space Mono',monospace">WHERE THE MARKET IS DECIDED</text>

  <!-- the obvious way -->
  <text x="56" y="110" fill="#C9C7BC" font-size="19" font-weight="600">The obvious way</text>
  <g transform="translate(56,132)">
    <rect width="150" height="62" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="75" y="38" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Arrive</text>
    <path d="M160 31 h32" stroke="#3A3A33" stroke-width="2"/><path d="M188 25 l9 6 -9 6z" fill="#3A3A33"/>
    <g transform="translate(202,0)"><rect width="150" height="62" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="75" y="38" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Log in</text></g>
    <path d="M362 31 h32" stroke="#3A3A33" stroke-width="2"/><path d="M390 25 l9 6 -9 6z" fill="#3A3A33"/>
    <g transform="translate(404,0)"><rect width="190" height="62" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="95" y="38" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Guess the market</text></g>
    <path d="M604 31 h32" stroke="#B23A3A" stroke-width="2"/><path d="M632 25 l9 6 -9 6z" fill="#B23A3A"/>
    <g transform="translate(646,0)"><rect width="352" height="62" rx="10" fill="#1A1414" stroke="#B23A3A" stroke-width="2"/>
      <text x="176" y="27" fill="#E88" font-size="13" text-anchor="middle">Correct it afterwards</text>
      <text x="176" y="47" fill="#8C6A6A" font-size="11.5" text-anchor="middle">wrong catalogue · wrong terms · wrong account shape</text></g>
  </g>
  <text x="56" y="238" fill="#8C6A6A" font-size="13.5">Everything shown before the correction was shown on a guess.</text>

  <line x1="56" y1="272" x2="1144" y2="272" stroke="rgba(239,237,227,.12)"/>

  <!-- the structure chosen -->
  <text x="56" y="318" fill="#C9C7BC" font-size="19" font-weight="600">The structure chosen</text>
  <g transform="translate(56,340)">
    <rect width="140" height="62" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="70" y="38" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Arrive</text>
    <path d="M150 31 h30" stroke="#C8FF4D" stroke-width="2"/><path d="M176 25 l9 6 -9 6z" fill="#C8FF4D"/>
    <g transform="translate(190,0)"><rect width="176" height="62" rx="10" fill="#0B0B09" stroke="#C8FF4D" stroke-width="2"/>
      <text x="88" y="27" fill="#C8FF4D" font-size="13" text-anchor="middle" font-weight="600">Country / region</text>
      <text x="88" y="46" fill="#85847A" font-size="11.5" text-anchor="middle">scopes the whole session</text></g>
    <path d="M376 31 h30" stroke="#C8FF4D" stroke-width="2"/><path d="M402 25 l9 6 -9 6z" fill="#C8FF4D"/>
    <g transform="translate(416,0)"><rect width="176" height="62" rx="10" fill="#0B0B09" stroke="#C8FF4D" stroke-width="2"/>
      <text x="88" y="27" fill="#C8FF4D" font-size="13" text-anchor="middle" font-weight="600">Language</text>
      <text x="88" y="46" fill="#85847A" font-size="11.5" text-anchor="middle">a separate choice</text></g>
    <path d="M602 31 h30" stroke="#C8FF4D" stroke-width="2"/><path d="M628 25 l9 6 -9 6z" fill="#C8FF4D"/>
    <g transform="translate(642,0)"><rect width="140" height="62" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="70" y="38" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Log in</text></g>
    <path d="M792 31 h30" stroke="#C8FF4D" stroke-width="2"/><path d="M818 25 l9 6 -9 6z" fill="#C8FF4D"/>
    <g transform="translate(832,0)"><rect width="200" height="62" rx="10" fill="#141A14" stroke="#3E8E5A" stroke-width="2"/>
      <text x="100" y="38" fill="#8FCBA4" font-size="13.5" text-anchor="middle">Correct from screen one</text></g>
  </g>

  <!-- why country ≠ language -->
  <rect x="56" y="446" width="1088" height="150" rx="14" fill="#171713" stroke="rgba(239,237,227,.12)"/>
  <text x="84" y="482" fill="#C8FF4D" font-size="13" font-family="'Space Mono',monospace">WHY THEY ARE TWO CHOICES AND NOT ONE</text>
  <g font-size="14">
    <text x="84" y="516" fill="#85847A">One country, two official languages</text>
    <text x="84" y="542" fill="#6B6A62" font-size="13">Inferring language from country gets half those customers wrong.</text>
    <text x="620" y="516" fill="#85847A">One language, many countries</text>
    <text x="620" y="542" fill="#6B6A62" font-size="13">Inferring country from language gets the catalogue and the terms wrong.</text>
  </g>
  <text x="84" y="576" fill="#C9C7BC" font-size="13.5">Collapsing them into one picker is the shortcut that breaks on the second market.</text>

  <text x="56" y="652" fill="#C8FF4D" font-size="14" font-family="'Space Mono',monospace">THE TRADE-OFF I ACCEPTED</text>
  <text x="56" y="686" fill="#85847A" font-size="15">It adds a step before anyone has logged in, and a step before login is the most expensive kind. I took it</text>
  <text x="56" y="710" fill="#85847A" font-size="15">because the alternative is not "no step" — it is every later screen hedging about which market it is in.</text>
  <text x="56" y="742" fill="#6B6A62" font-size="13.5">Illustrative diagram — structure only, redrawn generically. No production interface shown.</text>
</svg>
