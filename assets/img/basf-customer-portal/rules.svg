<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Instrument Sans',system-ui,sans-serif">
  <rect width="1200" height="720" fill="#121210"/>
  <text x="56" y="58" fill="#85847A" font-size="17" letter-spacing="2.4" font-family="'Space Mono',monospace">MARKET RULES AS DATA, NOT AS LOGIC IN THE SCREEN</text>

  <!-- fork model -->
  <text x="56" y="108" fill="#C9C7BC" font-size="18" font-weight="600">If the rules live inside the screen</text>
  <g transform="translate(56,128)">
    <g><rect width="150" height="88" rx="10" fill="#1A1414" stroke="#B23A3A"/><text x="75" y="36" fill="#E88" font-size="13" text-anchor="middle">Market A</text><text x="75" y="58" fill="#8C6A6A" font-size="11.5" text-anchor="middle">its own screen</text></g>
    <g transform="translate(166,0)"><rect width="150" height="88" rx="10" fill="#1A1414" stroke="#B23A3A"/><text x="75" y="36" fill="#E88" font-size="13" text-anchor="middle">Market B</text><text x="75" y="58" fill="#8C6A6A" font-size="11.5" text-anchor="middle">its own screen</text></g>
    <g transform="translate(332,0)"><rect width="150" height="88" rx="10" fill="#1A1414" stroke="#B23A3A"/><text x="75" y="36" fill="#E88" font-size="13" text-anchor="middle">Market C</text><text x="75" y="58" fill="#8C6A6A" font-size="11.5" text-anchor="middle">its own screen</text></g>
    <text x="516" y="40" fill="#8C6A6A" font-size="14">A legal change means reopening</text>
    <text x="516" y="62" fill="#8C6A6A" font-size="14">every screen that happens to touch it.</text>
    <text x="516" y="84" fill="#6B6A62" font-size="13">And the fourth market starts a fourth copy.</text>
  </g>

  <line x1="56" y1="262" x2="1144" y2="262" stroke="rgba(239,237,227,.12)"/>

  <!-- data model -->
  <text x="56" y="306" fill="#C9C7BC" font-size="18" font-weight="600">If the rules are configuration</text>

  <!-- rules store -->
  <rect x="56" y="330" width="300" height="250" rx="14" fill="#0B0B09" stroke="rgba(239,237,227,.14)"/>
  <text x="84" y="364" fill="#C8FF4D" font-size="12.5" font-family="'Space Mono',monospace">MARKET RULES</text>
  <g font-family="'Space Mono',monospace" font-size="12.5" fill="#85847A">
    <rect x="84" y="382" width="244" height="36" rx="7" fill="#171713"/><text x="100" y="405">which consents apply</text>
    <rect x="84" y="426" width="244" height="36" rx="7" fill="#171713"/><text x="100" y="449">opt-in or opt-out</text>
    <rect x="84" y="470" width="244" height="36" rx="7" fill="#171713"/><text x="100" y="493">channels offered</text>
    <rect x="84" y="514" width="244" height="36" rx="7" fill="#171713"/><text x="100" y="537">extra steps, if any</text>
  </g>

  <path d="M372 455 h50" stroke="#C8FF4D" stroke-width="2.5"/><path d="M416 448 l10 7 -10 7z" fill="#C8FF4D"/>

  <!-- one component -->
  <rect x="440" y="372" width="290" height="166" rx="14" fill="#0B0B09" stroke="#C8FF4D" stroke-width="2"/>
  <text x="585" y="404" fill="#C8FF4D" font-size="14" text-anchor="middle" font-weight="700">ONE COMPONENT</text>
  <text x="585" y="428" fill="#85847A" font-size="12.5" text-anchor="middle">from the design system</text>
  <rect x="470" y="446" width="230" height="30" rx="6" fill="#171713"/><rect x="482" y="457" width="12" height="12" rx="3" fill="#C8FF4D"/><rect x="506" y="459" width="120" height="8" rx="4" fill="#3A3A33"/>
  <rect x="470" y="484" width="230" height="30" rx="6" fill="#171713"/><rect x="482" y="495" width="12" height="12" rx="3" fill="none" stroke="#5A5A52" stroke-width="1.6"/><rect x="506" y="497" width="92" height="8" rx="4" fill="#2A2A22"/>

  <path d="M746 455 h50" stroke="#C8FF4D" stroke-width="2.5"/><path d="M790 448 l10 7 -10 7z" fill="#C8FF4D"/>

  <!-- rendered per market -->
  <g transform="translate(814,342)">
    <rect width="330" height="74" rx="10" fill="#141A14" stroke="#3E8E5A"/><text x="24" y="32" fill="#8FCBA4" font-size="13">Market A</text><text x="24" y="54" fill="#6A8C76" font-size="11.5">its rules, same component</text>
    <g transform="translate(0,88)"><rect width="330" height="74" rx="10" fill="#141A14" stroke="#3E8E5A"/><text x="24" y="32" fill="#8FCBA4" font-size="13">Market B</text><text x="24" y="54" fill="#6A8C76" font-size="11.5">different rules, same component</text></g>
    <g transform="translate(0,176)"><rect width="330" height="74" rx="10" fill="#171713" stroke="rgba(239,237,227,.2)" stroke-dasharray="5 4"/><text x="24" y="32" fill="#C9C7BC" font-size="13">The next market</text><text x="24" y="54" fill="#85847A" font-size="11.5">adds rules, not a screen</text></g>
  </g>

  <text x="56" y="634" fill="#C8FF4D" font-size="14" font-family="'Space Mono',monospace">WHY IT MATTERS MORE THAN IT SOUNDS</text>
  <text x="56" y="668" fill="#85847A" font-size="15">Consent rules change on someone else's schedule — a regulator's. Designing them as data is what keeps a</text>
  <text x="56" y="692" fill="#85847A" font-size="15">legal update from becoming a redesign, and what makes the next market a configuration rather than a project.</text>
</svg>
