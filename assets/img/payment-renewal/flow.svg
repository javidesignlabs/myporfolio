<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Instrument Sans',system-ui,sans-serif">
  <rect width="1200" height="720" fill="#121210"/>
  <text x="56" y="58" fill="#85847A" font-size="17" letter-spacing="2.4" font-family="'Space Mono',monospace">WHERE THE EVENT LOG SAID PEOPLE LEFT</text>

  <!-- BEFORE -->
  <text x="56" y="112" fill="#C9C7BC" font-size="19" font-weight="600">Before</text>
  <g transform="translate(56,132)">
    <rect width="150" height="64" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="75" y="39" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Enter details</text>
    <path d="M160 32 h34" stroke="#3A3A33" stroke-width="2"/><path d="M190 26 l9 6 -9 6z" fill="#3A3A33"/>
    <g transform="translate(204,0)"><rect width="150" height="64" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="75" y="39" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Submit</text></g>
    <path d="M364 32 h34" stroke="#3A3A33" stroke-width="2"/><path d="M394 26 l9 6 -9 6z" fill="#3A3A33"/>
    <g transform="translate(408,0)"><rect width="190" height="64" rx="10" fill="#1A1414" stroke="#B23A3A" stroke-width="2"/><text x="95" y="33" fill="#E88" font-size="13.5" text-anchor="middle">…nothing</text><text x="95" y="51" fill="#8C6A6A" font-size="11.5" text-anchor="middle">no status, no receipt</text></g>
    <path d="M608 32 h34" stroke="#3A3A33" stroke-width="2"/><path d="M638 26 l9 6 -9 6z" fill="#3A3A33"/>
    <g transform="translate(652,0)"><rect width="190" height="64" rx="10" fill="#1A1414" stroke="#B23A3A" stroke-width="2"/><text x="95" y="33" fill="#E88" font-size="13.5" text-anchor="middle">Error → start over</text><text x="95" y="51" fill="#8C6A6A" font-size="11.5" text-anchor="middle">no in-place fix</text></g>
    <!-- drop markers -->
    <g transform="translate(503,78)"><path d="M0 0 v22" stroke="#B23A3A" stroke-width="2" stroke-dasharray="3 3"/><circle cx="0" cy="30" r="7" fill="#B23A3A"/><text x="14" y="35" fill="#C98" font-size="12.5" font-family="'Space Mono',monospace">drop-off 1</text></g>
    <g transform="translate(747,78)"><path d="M0 0 v22" stroke="#B23A3A" stroke-width="2" stroke-dasharray="3 3"/><circle cx="0" cy="30" r="7" fill="#B23A3A"/><text x="14" y="35" fill="#C98" font-size="12.5" font-family="'Space Mono',monospace">drop-off 2</text></g>
  </g>

  <line x1="56" y1="300" x2="1144" y2="300" stroke="rgba(239,237,227,.12)"/>

  <!-- AFTER -->
  <text x="56" y="346" fill="#C9C7BC" font-size="19" font-weight="600">After</text>
  <g transform="translate(56,366)">
    <rect width="150" height="64" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="75" y="33" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Enter details</text><text x="75" y="51" fill="#6B6A62" font-size="11.5" text-anchor="middle">step 1 of 3</text>
    <path d="M160 32 h34" stroke="#C8FF4D" stroke-width="2"/><path d="M190 26 l9 6 -9 6z" fill="#C8FF4D"/>
    <g transform="translate(204,0)"><rect width="190" height="64" rx="10" fill="#171713" stroke="rgba(239,237,227,.12)"/><text x="95" y="33" fill="#C9C7BC" font-size="13.5" text-anchor="middle">Confirm what renews</text><text x="95" y="51" fill="#6B6A62" font-size="11.5" text-anchor="middle">payment ≠ renewal</text></g>
    <path d="M404 32 h34" stroke="#C8FF4D" stroke-width="2"/><path d="M434 26 l9 6 -9 6z" fill="#C8FF4D"/>
    <g transform="translate(448,0)"><rect width="170" height="64" rx="10" fill="#141A14" stroke="#3E8E5A" stroke-width="2"/><text x="85" y="33" fill="#8FCBA4" font-size="13.5" text-anchor="middle">Processing…</text><text x="85" y="51" fill="#6A8C76" font-size="11.5" text-anchor="middle">status is visible</text></g>
    <path d="M628 32 h34" stroke="#C8FF4D" stroke-width="2"/><path d="M658 26 l9 6 -9 6z" fill="#C8FF4D"/>
    <g transform="translate(672,0)"><rect width="170" height="64" rx="10" fill="#141A14" stroke="#3E8E5A" stroke-width="2"/><text x="85" y="39" fill="#8FCBA4" font-size="13.5" text-anchor="middle">Confirmed</text></g>
    <!-- recovery branch -->
    <path d="M533 78 v34 h190" stroke="#C8FF4D" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <path d="M719 106 l9 6 -9 6z" fill="#C8FF4D"/>
    <g transform="translate(732,86)"><rect width="200" height="52" rx="10" fill="#171713" stroke="#C8FF4D"/><text x="100" y="24" fill="#C8FF4D" font-size="12.5" text-anchor="middle" font-family="'Space Mono',monospace">IF IT FAILS</text><text x="100" y="42" fill="#C9C7BC" font-size="12.5" text-anchor="middle">fix the field, keep the rest</text></g>
  </g>

  <text x="56" y="596" fill="#C8FF4D" font-size="14" font-family="'Space Mono',monospace">THE TWO CHANGES</text>
  <text x="56" y="630" fill="#85847A" font-size="15">Separate the two decisions users were conflating, and never leave the screen silent. Everything else</text>
  <text x="56" y="654" fill="#85847A" font-size="15">in the flow stayed where it was — these were the two points the logs and the surveys both pointed at.</text>
  <text x="56" y="694" fill="#6B6A62" font-size="13.5">Illustrative diagram — flow structure redrawn generically, no production interface shown.</text>
</svg>
