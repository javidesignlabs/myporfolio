<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="'Instrument Sans',system-ui,sans-serif">
  <rect width="1200" height="700" fill="#121210"/>
  <text x="56" y="60" fill="#85847A" font-size="17" letter-spacing="2.4" font-family="'Space Mono',monospace">DOCUMENTING A COMPONENT IN ZEROHEIGHT</text>

  <!-- browser frame -->
  <rect x="56" y="98" width="1088" height="470" rx="16" fill="#171713" stroke="rgba(239,237,227,.12)"/>
  <rect x="56" y="98" width="1088" height="48" rx="16" fill="#0B0B09"/><rect x="56" y="130" width="1088" height="16" fill="#0B0B09"/>
  <circle cx="84" cy="122" r="6" fill="#3A3A33"/><circle cx="104" cy="122" r="6" fill="#3A3A33"/><circle cx="124" cy="122" r="6" fill="#3A3A33"/>
  <rect x="152" y="110" width="300" height="24" rx="12" fill="#171713"/>
  <text x="170" y="127" fill="#6B6A62" font-size="12" font-family="'Space Mono',monospace">zeroheight · button</text>

  <!-- sidebar -->
  <rect x="56" y="146" width="230" height="422" fill="#0B0B09"/>
  <g font-size="13.5" fill="#6B6A62">
    <text x="84" y="186" fill="#85847A" font-family="'Space Mono',monospace" font-size="11.5">FOUNDATIONS</text>
    <text x="84" y="214">Colour</text><text x="84" y="240">Typography</text><text x="84" y="266">Spacing</text><text x="84" y="292">Elevation</text>
    <text x="84" y="334" fill="#85847A" font-family="'Space Mono',monospace" font-size="11.5">COMPONENTS</text>
    <rect x="70" y="346" width="200" height="30" rx="6" fill="#1B1420"/>
    <text x="84" y="366" fill="#C8FF4D">Button</text>
    <text x="84" y="398">Input</text><text x="84" y="424">Select</text><text x="84" y="450">Modal</text><text x="84" y="476">Table</text><text x="84" y="502">Toast</text>
  </g>

  <!-- content -->
  <text x="320" y="196" fill="#EFEDE3" font-size="28" font-weight="700">Button</text>
  <rect x="320" y="212" width="78" height="22" rx="11" fill="#1B1420"/><text x="359" y="227" fill="#B79BE0" font-size="11.5" text-anchor="middle" font-family="'Space Mono',monospace">STABLE</text>
  <rect x="408" y="212" width="78" height="22" rx="11" fill="#171713"/><text x="447" y="227" fill="#6B6A62" font-size="11.5" text-anchor="middle" font-family="'Space Mono',monospace">v2.0</text>

  <!-- live preview -->
  <rect x="320" y="256" width="500" height="130" rx="10" fill="#0B0B09"/>
  <rect x="356" y="296" width="128" height="42" rx="8" fill="#5B2A8C"/><text x="420" y="322" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle">Primary</text>
  <rect x="504" y="296" width="128" height="42" rx="8" fill="none" stroke="#5B2A8C" stroke-width="2"/><text x="568" y="322" fill="#C9C7BC" font-size="13.5" font-weight="600" text-anchor="middle">Secondary</text>
  <text x="664" y="322" fill="#9B7FC4" font-size="13.5" font-weight="600">Tertiary</text>
  <text x="320" y="248" fill="#6B6A62" font-size="12" font-family="'Space Mono',monospace">LIVE PREVIEW</text>

  <!-- usage do/dont -->
  <g>
    <rect x="320" y="406" width="242" height="130" rx="10" fill="#0B0B09"/>
    <circle cx="344" cy="432" r="9" fill="#3E8E5A"/><path d="M340 432 l3 4 6-7" stroke="#0B0B09" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="364" y="437" fill="#C9C7BC" font-size="14" font-weight="600">Do</text>
    <text x="344" y="464" fill="#85847A" font-size="13">One primary action</text>
    <text x="344" y="486" fill="#85847A" font-size="13">per screen area.</text>
    <text x="344" y="514" fill="#6B6A62" font-size="12.5">Verb-first labels.</text>

    <rect x="578" y="406" width="242" height="130" rx="10" fill="#0B0B09"/>
    <circle cx="602" cy="432" r="9" fill="#B23A3A"/><path d="M598 428 l8 8 M606 428 l-8 8" stroke="#0B0B09" stroke-width="2" stroke-linecap="round"/>
    <text x="622" y="437" fill="#C9C7BC" font-size="14" font-weight="600">Don't</text>
    <text x="602" y="464" fill="#85847A" font-size="13">Two primaries competing</text>
    <text x="602" y="486" fill="#85847A" font-size="13">for the same decision.</text>
    <text x="602" y="514" fill="#6B6A62" font-size="12.5">"Submit" as a label.</text>
  </g>

  <!-- right column: props + a11y -->
  <rect x="846" y="256" width="270" height="280" rx="10" fill="#0B0B09"/>
  <text x="868" y="286" fill="#C8FF4D" font-size="12" font-family="'Space Mono',monospace">PROPS</text>
  <g font-family="'Space Mono',monospace" font-size="11.5" fill="#85847A">
    <text x="868" y="312">variant</text><text x="868" y="334">size</text><text x="868" y="356">loading</text><text x="868" y="378">disabled</text><text x="868" y="400">iconStart</text>
  </g>
  <text x="868" y="440" fill="#C8FF4D" font-size="12" font-family="'Space Mono',monospace">ACCESSIBILITY</text>
  <text x="868" y="466" fill="#85847A" font-size="12.5">Focus ring always visible</text>
  <text x="868" y="488" fill="#85847A" font-size="12.5">Loading announces busy</text>
  <text x="868" y="510" fill="#85847A" font-size="12.5">4.5:1 minimum contrast</text>

  <text x="56" y="616" fill="#C8FF4D" font-size="14" font-family="'Space Mono',monospace">WHY DOCUMENT OUTSIDE FIGMA</text>
  <text x="56" y="650" fill="#85847A" font-size="15">Figma shows designers what a component looks like; it does not tell a developer what props exist or</text>
  <text x="56" y="674" fill="#85847A" font-size="15">what a screen reader should say. Zeroheight gave both audiences one URL to point at in a review.</text>
</svg>
