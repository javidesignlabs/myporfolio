<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Instrument Sans',system-ui,sans-serif">
  <rect width="1200" height="760" fill="#121210"/>
  <text x="56" y="62" fill="#85847A" font-size="17" letter-spacing="2.4" font-family="'Space Mono',monospace">AUTOMATED COMPONENT INVENTORY</text>

  <!-- step 1 -->
  <rect x="56" y="110" width="250" height="210" rx="16" fill="#171713" stroke="rgba(239,237,227,.12)"/>
  <text x="80" y="152" fill="#C8FF4D" font-size="13" font-family="'Space Mono',monospace">01</text>
  <text x="80" y="184" fill="#EFEDE3" font-size="19" font-weight="600">Crawl</text>
  <text x="80" y="214" fill="#85847A" font-size="14">A script walks every</text>
  <text x="80" y="236" fill="#85847A" font-size="14">page of the live site</text>
  <text x="80" y="258" fill="#85847A" font-size="14">and screenshots each</text>
  <text x="80" y="280" fill="#85847A" font-size="14">component it finds.</text>

  <path d="M322 215 h44" stroke="#C8FF4D" stroke-width="2.5"/><path d="M360 208 l10 7 -10 7z" fill="#C8FF4D"/>

  <!-- step 2 -->
  <rect x="386" y="110" width="250" height="210" rx="16" fill="#171713" stroke="rgba(239,237,227,.12)"/>
  <text x="410" y="152" fill="#C8FF4D" font-size="13" font-family="'Space Mono',monospace">02</text>
  <text x="410" y="184" fill="#EFEDE3" font-size="19" font-weight="600">Compare</text>
  <text x="410" y="214" fill="#85847A" font-size="14">Each live component</text>
  <text x="410" y="236" fill="#85847A" font-size="14">is matched against the</text>
  <text x="410" y="258" fill="#85847A" font-size="14">library — flagging what</text>
  <text x="410" y="280" fill="#85847A" font-size="14">drifted or duplicated.</text>

  <path d="M652 215 h44" stroke="#C8FF4D" stroke-width="2.5"/><path d="M690 208 l10 7 -10 7z" fill="#C8FF4D"/>

  <!-- step 3 -->
  <rect x="716" y="110" width="250" height="210" rx="16" fill="#171713" stroke="rgba(239,237,227,.12)"/>
  <text x="740" y="152" fill="#C8FF4D" font-size="13" font-family="'Space Mono',monospace">03</text>
  <text x="740" y="184" fill="#EFEDE3" font-size="19" font-weight="600">Publish</text>
  <text x="740" y="214" fill="#85847A" font-size="14">One markdown file per</text>
  <text x="740" y="236" fill="#85847A" font-size="14">component, pushed to</text>
  <text x="740" y="258" fill="#85847A" font-size="14">the wiki the engineers</text>
  <text x="740" y="280" fill="#85847A" font-size="14">already read.</text>

  <!-- result grid -->
  <text x="56" y="392" fill="#EFEDE3" font-size="21" font-weight="600">What came back</text>
  <text x="56" y="420" fill="#85847A" font-size="14.5">40 components, each with a screenshot, where it appears, and whether it matches the library.</text>

