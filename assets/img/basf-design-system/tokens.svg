<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Instrument Sans',system-ui,sans-serif">
  <rect width="1200" height="760" fill="#121210"/>
  <text x="56" y="62" fill="#85847A" font-size="17" letter-spacing="2.4" font-family="'Space Mono',monospace">THREE-TIER TOKEN ARCHITECTURE</text>

  <!-- tier 1 -->
  <rect x="56" y="104" width="316" height="560" rx="18" fill="#171713" stroke="rgba(239,237,227,.12)"/>
  <text x="84" y="146" fill="#EFEDE3" font-size="22" font-weight="600">1 · Primitives</text>
  <text x="84" y="174" fill="#85847A" font-size="15">Raw values. No meaning.</text>
  <g font-family="'Space Mono',monospace" font-size="13.5">
    <rect x="84" y="200" width="260" height="46" rx="9" fill="#0B0B09"/><circle cx="108" cy="223" r="11" fill="#2B6CB0"/><text x="130" y="228" fill="#C9C7BC">blue-600</text>
    <rect x="84" y="254" width="260" height="46" rx="9" fill="#0B0B09"/><circle cx="108" cy="277" r="11" fill="#1A4480"/><text x="130" y="282" fill="#C9C7BC">blue-800</text>
    <rect x="84" y="308" width="260" height="46" rx="9" fill="#0B0B09"/><circle cx="108" cy="331" r="11" fill="#D64545"/><text x="130" y="336" fill="#C9C7BC">red-500</text>
    <rect x="84" y="362" width="260" height="46" rx="9" fill="#0B0B09"/><circle cx="108" cy="385" r="11" fill="#3E8E5A"/><text x="130" y="390" fill="#C9C7BC">green-500</text>
    <rect x="84" y="416" width="260" height="46" rx="9" fill="#0B0B09"/><rect x="97" y="412" width="22" height="22" rx="4" fill="#3A3A33"/><text x="130" y="444" fill="#C9C7BC">space-400</text>
    <rect x="84" y="470" width="260" height="46" rx="9" fill="#0B0B09"/><rect x="97" y="466" width="22" height="22" rx="4" fill="#3A3A33"/><text x="130" y="498" fill="#C9C7BC">radius-200</text>
  </g>
  <text x="84" y="560" fill="#85847A" font-size="13.5" font-family="'Space Mono',monospace">~240 values</text>
  <text x="84" y="590" fill="#85847A" font-size="13.5">Never referenced</text>
  <text x="84" y="612" fill="#85847A" font-size="13.5">directly by a component.</text>

  <!-- arrow 1 -->
  <path d="M388 384 h40" stroke="#C8FF4D" stroke-width="2.5"/>
  <path d="M422 377 l10 7 -10 7z" fill="#C8FF4D"/>

  <!-- tier 2 -->
  <rect x="444" y="104" width="316" height="560" rx="18" fill="#171713" stroke="rgba(239,237,227,.12)"/>
  <text x="472" y="146" fill="#EFEDE3" font-size="22" font-weight="600">2 · Semantic</text>
  <text x="472" y="174" fill="#85847A" font-size="15">Meaning, not colour.</text>
  <g font-family="'Space Mono',monospace" font-size="13">
    <rect x="472" y="200" width="260" height="56" rx="9" fill="#0B0B09"/>
    <text x="490" y="224" fill="#C8FF4D">action.primary</text><text x="490" y="244" fill="#6B6A62">→ blue-600</text>
    <rect x="472" y="264" width="260" height="56" rx="9" fill="#0B0B09"/>
    <text x="490" y="288" fill="#C8FF4D">action.hover</text><text x="490" y="308" fill="#6B6A62">→ blue-800</text>
    <rect x="472" y="328" width="260" height="56" rx="9" fill="#0B0B09"/>
    <text x="490" y="352" fill="#C8FF4D">feedback.error</text><text x="490" y="372" fill="#6B6A62">→ red-500</text>
    <rect x="472" y="392" width="260" height="56" rx="9" fill="#0B0B09"/>
    <text x="490" y="416" fill="#C8FF4D">feedback.success</text><text x="490" y="436" fill="#6B6A62">→ green-500</text>
    <rect x="472" y="456" width="260" height="56" rx="9" fill="#0B0B09"/>
    <text x="490" y="480" fill="#C8FF4D">surface.raised</text><text x="490" y="500" fill="#6B6A62">→ neutral-050</text>
  </g>
  <text x="472" y="560" fill="#85847A" font-size="13.5">This is the layer that</text>
  <text x="472" y="582" fill="#85847A" font-size="13.5">made theming possible:</text>
  <text x="472" y="604" fill="#85847A" font-size="13.5">swap the mapping, not</text>
  <text x="472" y="626" fill="#85847A" font-size="13.5">the components.</text>

  <!-- arrow 2 -->
  <path d="M776 384 h40" stroke="#C8FF4D" stroke-width="2.5"/>
  <path d="M810 377 l10 7 -10 7z" fill="#C8FF4D"/>

  <!-- tier 3 -->
  <rect x="832" y="104" width="312" height="560" rx="18" fill="#171713" stroke="rgba(239,237,227,.12)"/>
  <text x="860" y="146" fill="#EFEDE3" font-size="22" font-weight="600">3 · Component</text>
  <text x="860" y="174" fill="#85847A" font-size="15">Bound in Figma + code.</text>
  <rect x="860" y="200" width="256" height="150" rx="12" fill="#0B0B09"/>
  <rect x="884" y="232" width="150" height="40" rx="20" fill="#2B6CB0"/>
  <text x="959" y="257" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">Primary action</text>
  <text x="884" y="306" fill="#6B6A62" font-size="12" font-family="'Space Mono',monospace">button.bg</text>
  <text x="884" y="326" fill="#6B6A62" font-size="12" font-family="'Space Mono',monospace">→ action.primary</text>
  <rect x="860" y="366" width="256" height="150" rx="12" fill="#0B0B09"/>
  <rect x="884" y="398" width="208" height="40" rx="8" fill="none" stroke="#D64545" stroke-width="2"/>
  <text x="896" y="423" fill="#85847A" font-size="13">Field with error</text>
  <text x="884" y="472" fill="#6B6A62" font-size="12" font-family="'Space Mono',monospace">input.border.invalid</text>
  <text x="884" y="492" fill="#6B6A62" font-size="12" font-family="'Space Mono',monospace">→ feedback.error</text>
  <text x="860" y="560" fill="#85847A" font-size="13.5">A designer picks the</text>
  <text x="860" y="582" fill="#85847A" font-size="13.5">component; the tokens</text>
  <text x="860" y="604" fill="#85847A" font-size="13.5">come with it.</text>

  <text x="56" y="716" fill="#6B6A62" font-size="14">Illustrative diagram — structure only. Values shown are generic placeholders, not production tokens.</text>
</svg>
